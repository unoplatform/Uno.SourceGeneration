- job: macOS

  dependsOn:
  - Build_Packages

  variables:
    NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
    RestoreLockedMode: false # Until https://github.com/NuGet/Home/issues/8645

  strategy:
    matrix:
      NET_10_0_100:
         VM_Image: 'macOS-14'
         NETCORE_VERSION: 10.0.x
         NETCORE_PREVIEW: True
      NET_9_0_100:
         VM_Image: 'macOS-14'
         NETCORE_VERSION: 9.0.x
         NETCORE_PREVIEW: False
      NET_8_0_100:
         VM_Image: 'macOS-14'
         NETCORE_VERSION: 8.0.x
         NETCORE_PREVIEW: False

  pool:
    vmImage: $(VM_Image)

  steps:

  - task: gitversion/setup@3
    retryCountOnTaskFailure: 3
    inputs:
      versionSpec: '6.0.5'

  - task: gitversion/execute@3
    retryCountOnTaskFailure: 3
    inputs:
      updateAssemblyInfo: 'False'
      useConfigFile: true
      configFilePath: gitversion.yml
    displayName: Use GitVersion

  - task: CacheBeta@0
    inputs:
      key: nuget | **/packages.lock.json
      path: $(NUGET_PACKAGES)
    displayName: Cache NuGet packages

  - task: DownloadBuildArtifacts@0
    inputs:
      ArtifactName: unosourcegenerator-drop
      downloadPath: '$(System.ArtifactsDirectory)'

  - task: CopyFiles@2
    inputs:
        sourceFolder: '$(System.ArtifactsDirectory)/unosourcegenerator-drop/build'
        targetFolder: $(build.sourcesdirectory)/src/PackageCache

  - task: UseDotNet@2
    displayName: 'Install .NET 10.0 SDK (required by global.json)'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - task: DotNetCoreInstaller@2
    inputs:
      version: $(NETCORE_VERSION)
      includePreviewVersions: $(NETCORE_PREVIEW)
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - bash: dotnet build -c Release /p:SOURCEGEN_VERSION=$(GITVERSION.SemVer) /p:SAMPLES_BUILD=true ./src/Uno.SourceGenerator.Samples.Unix.sln /bl:$(build.artifactstagingdirectory)/binlog/macos-sample-build-$(NETCORE_VERSION).binlog
    displayName: Build

  - bash: |
      cd $(build.sourcesdirectory)/src/Uno.SampleCoreApp
      dotnet build --configuration Release -p:SAMPLES_BUILD=true -p:SOURCEGEN_VERSION=$(GITVERSION.SemVer) /bl:$(build.artifactstagingdirectory)/binlog/macos-sample-build-$(NETCORE_VERSION)-netcore.binlog
