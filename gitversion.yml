workflow: GitHubFlow/v1
assembly-versioning-scheme: MajorMinorPatch
next-version: 3.0.0

branches:
  master:
    regex: ^master$|^main$
    label: dev
    increment: Minor
    mode: ContinuousDeployment
    is-main-branch: true
    is-source-branch-for: ['beta', 'stable']

  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    label: 'PullRequest'
    label-number-pattern: '[/-](?<number>\d+)[-/]'
    increment: Inherit
    mode: ContinuousDeployment

  beta:
    regex: ^release/beta/.*
    label: beta
    increment: None
    source-branches: ['master']
    mode: ContinuousDeployment

  stable:
    regex: ^release/stable/.*
    label: ''
    increment: Patch
    source-branches: ['master','beta']
    is-main-branch: true

  dev:
    regex: ^dev/.*?/(.*?)
    label: dev.{BranchName}
    source-branches: ['master', 'release', 'projects', 'feature']
    increment: None
    mode: ContinuousDeployment

  projects:
    regex: ^projects/(.*?)
    label: proj-{BranchName}
    source-branches: ['master']
    increment: None

  feature:
    regex: ^feature/(.*?)
    label: feature.{BranchName}
    source-branches: ['master']
    increment: None

ignore:
  sha: []


